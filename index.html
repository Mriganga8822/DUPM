<style>
:root{--sand:#f2cf8f;--sand2:#e9b768;--map:#f8edaa;--mapEdge:#eea86a;--orange:#e0834f;--red:#f05452;--sea:#00b5f0;--sea2:#53c9f7;--ink:#7a4a2a}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:'Chewy','Comic Sans MS',cursive,sans-serif;color:var(--ink);overflow:hidden;
background:radial-gradient(circle at 20% 20%,#fbe3b0,transparent 50%),radial-gradient(circle at 80% 80%,#e6b366,transparent 55%),var(--sand);
display:flex;align-items:center;justify-content:center;position:relative}
body::before{content:"";position:absolute;inset:0;opacity:.35;
background-image:radial-gradient(#fff 1.5px,transparent 2px),radial-gradient(#fff 1px,transparent 1.5px);
background-size:70px 60px,43px 37px;background-position:0 0,20px 15px}
.deco{position:absolute;pointer-events:none}
.wave{left:0;bottom:0;width:38vw;max-width:420px;height:55vh;background:var(--sea);
clip-path:polygon(0 0,35% 25%,60% 60%,100% 100%,0 100%)}
.wave::after{content:"";position:absolute;inset:0;background:var(--sea2);
clip-path:polygon(0 10%,28% 32%,55% 66%,78% 88%,70% 100%,0 100%);opacity:.55}
.star1{top:-30px;left:-30px;font-size:130px;transform:rotate(-15deg)}
.star2{right:6vw;bottom:24vh;font-size:80px;transform:rotate(15deg)}
.shell{left:12vw;top:22vh;font-size:80px}
.ring{right:-30px;top:-30px;font-size:150px}
.hat{right:-10px;bottom:-20px;font-size:130px}
.map{position:relative;width:min(560px,88vw);padding:48px 24px 40px;text-align:center;
background:var(--map);border-radius:10px 14px 8px 12px;box-shadow:12px 12px 0 var(--mapEdge)}
h1{font-weight:400;font-size:clamp(72px,16vw,130px);margin:0 0 30px;color:var(--orange);letter-spacing:4px;
text-shadow:3px 3px 0 #f5c99f}
.sub{margin:-18px 0 28px;font-size:20px;opacity:.8}
button{font-family:inherit;cursor:pointer}
#go{background:var(--red);color:#fff;border:0;border-radius:22px;padding:16px 34px;font-size:30px;
letter-spacing:1px;box-shadow:0 6px 0 #c13d3b;transition:transform .1s,box-shadow .1s}
#go:hover{transform:translateY(-2px)}
#go:active{transform:translateY(5px);box-shadow:0 1px 0 #c13d3b}
:focus-visible{outline:4px solid #2b7fd1;outline-offset:3px}
#modal{position:fixed;inset:0;background:rgba(40,25,10,.45);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
#modal.open{display:flex}
.card{background:var(--map);border-radius:14px;box-shadow:10px 10px 0 var(--mapEdge);padding:36px 26px 28px;
width:min(520px,100%);text-align:center;animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.6) rotate(-4deg);opacity:0}to{transform:none;opacity:1}}
.card p{font-size:clamp(22px,5vw,30px);line-height:1.3;margin:0 0 26px;color:var(--ink)}
.row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.row button{border:0;border-radius:16px;padding:12px 22px;font-size:21px;color:#fff}
#again{background:var(--red);box-shadow:0 4px 0 #c13d3b}
#close{background:var(--sea);box-shadow:0 4px 0 #0088b8}
.lang{position:fixed;top:14px;right:14px;z-index:5;display:flex;background:#fff8;border-radius:20px;padding:4px;box-shadow:0 3px 0 var(--mapEdge)}
.lang button{border:0;background:transparent;color:var(--ink);font-size:18px;padding:6px 14px;border-radius:16px}
.lang button[aria-pressed="true"]{background:var(--red);color:#fff}
@media(prefers-reduced-motion:reduce){.card{animation:none}}
</style>

function setLang(l){

  document.documentElement.lang=l==='hi'?'hi-Latn':'en';

  document.getElementById('close').textContent=t.close;
  document.getElementById('sub').textContent=t.sub;
  document.getElementById('l-en').setAttribute('aria-pressed',l==='en');
  document.getElementById('l-hi').setAttribute('aria-pressed',l==='hi');
  if(modal.classList.contains('open'))show();
}
const modal=document.getElementById('modal'),q=document.getElementById('quote');
let last=-1,ctx;
function pop(){
  try{
    ctx=ctx||new (window.AudioContext||window.webkitAudioContext)();
    if(ctx.state==='suspended')ctx.resume();
    const t=ctx.currentTime;
    [[523.25,0],[659.25,.12],[783.99,.24],[1046.5,.36]].forEach(([f,d])=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='triangle';o.frequency.value=f;
      g.gain.setValueAtTime(0,t+d);
      g.gain.linearRampToValueAtTime(.25,t+d+.02);
      g.gain.exponentialRampToValueAtTime(.001,t+d+.35);
      o.connect(g).connect(ctx.destination);o.start(t+d);o.stop(t+d+.4);
    });
    // sad trombone finish
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sawtooth';o.frequency.setValueAtTime(220,t+.6);
    o.frequency.exponentialRampToValueAtTime(110,t+1.2);
    g.gain.setValueAtTime(.12,t+.6);g.gain.exponentialRampToValueAtTime(.001,t+1.25);
    o.connect(g).connect(ctx.destination);o.start(t+.6);o.stop(t+1.3);
  }catch(e){}
}
function show(){
  const P=lang==='hi'?hinglish:quotes;
  let i;do{i=Math.floor(Math.random()*P.length)}while(i===last);
  last=i;q.textContent=P[i];
  modal.classList.add('open');pop();
  document.getElementById('again').focus();
}
function hide(){modal.classList.remove('open');document.getElementById('go').focus()}
document.getElementById('go').onclick=show;

document.getElementById('close').onclick=hide;
modal.onclick=e=>{if(e.target===modal)hide()};
addEventListener('keydown',e=>{if(e.key==='Escape')hide()});
document.getElementById('l-en').onclick=()=>setLang('en');
document.getElementById('l-hi').onclick=()=>setLang('hi');
